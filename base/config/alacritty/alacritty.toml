general.import = [
  "~/.local/share/themes/Alacritty/catppuccin-macchiato.toml"
]

[window]
opacity = 0.85
startup_mode = "Fullscreen"

[font]
size = 11
# normal = { family = "Iosevka Term Medium", style = "Regular" }
# bold = { family = "Iosevka Term Medium", style = "Bold" }
# italic = { family = "Iosevka Term Medium", style = "Italic" }
# bold_italic = { family = "Iosevka Term Medium", style = "Bold Italic" }

normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font Mono", style = "Bold Italic" }

# normal = { family = "Maple Mono Normal NL", style = "Regular" }
# bold = { family = "Maple Mono Normal NL", style = "Bold" }
# italic = { family = "Maple Mono Normal NL", style = "Italic" }
# bold_italic = { family = "Maple Mono Normal NL", style = "Bold Italic" }


[scrolling]
history = 10000
multiplier = 1

[window.padding]
x = 0
y = 0

[selection]
save_to_clipboard = true
